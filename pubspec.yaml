name: openstrap_edge
description: "Subscription-free WHOOP 4 to Android Health Connect bridge."
publish_to: 'none'
version: 0.10.1+68

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # Full commit pins: transport and metrics remain in their sibling repositories.
  openstrap_protocol:
    git:
      url: https://github.com/OpenStrap/protocol.git
      ref: bc7d8d0df706e40a2546ffde4545263f09d0fecb
  openstrap_analytics:
    git:
      url: https://github.com/OpenStrap/analytics.git
      ref: 0441ef9e6fc6d5681c309ce6341911285e829f20
  flutter_blue_plus: ^1.36.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # LocalDb retains its old backup-read seam for schema compatibility.
  archive: ^4.0.9
  shared_preferences: ^2.3.3
  collection: ^1.18.0
  health: ^12.2.1
  android_intent_plus: ^5.1.0
  # Cancels the old Dart jobs without cancelling the native BLE watchdog.
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8
  yaml: ^3.1.2
  sqflite_common_ffi: ^2.4.0+3
  fake_async: ^1.3.1
  ffi: ^2.1.0
  path_provider_platform_interface: ^2.1.0
  sqflite_common: 2.5.8

flutter:
  uses-material-design: true
